{% load static %}

<!DOCTYPE html>
<html>

<head>
    <title>JobTrack - Delete Job</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav>

        <h2>JobTrack</h2>

        <div>
              <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'job_list' %}">Jobs</a>
                <a href="{% url 'dashboard' %}">Dashboard</a>
        </div>

    </nav>


    <main>

        <h1>Delete Job</h1>

        <div class="job-card">

            <h2>Are you sure?</h2>

            <p>
                Do you want to delete the following job?
            </p>

            <p>
                <strong>Company:</strong>
                {{ job.company }}
            </p>

            <p>
                <strong>Role:</strong>
                {{ job.role }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit">
                    Yes, Delete
                </button>

                <a href="/jobs/">
                    <button type="button">
                        Cancel
                    </button>
                </a>

            </form>

        </div>

    </main>

</body>

</html>
