{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>JobTrack - Sign Up</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <nav>

        <h2>JobTrack</h2>

        <div>

            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'job_list' %}">Jobs</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>

        </div>

    </nav>


    <main>

        <h1>Create Your Account</h1>

        <div class="job-form">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Sign Up
                </button>

            </form>

        </div>

    </main>

</body>

</html>
